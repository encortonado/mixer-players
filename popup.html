<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
      :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    width: 320px;
    padding: 16px;
    border-radius: 18px;
    font: 14px/1.4 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: #f4f6ff;
    /* as "manchas" de cor atrás é o que o vidro desfoca */
    background:
      radial-gradient(150px 130px at 12% 8%,  rgba(255, 90, 170, .60), transparent 70%),
      radial-gradient(170px 170px at 95% 32%, rgba(80, 140, 255, .60), transparent 70%),
      radial-gradient(160px 150px at 25% 96%, rgba(60, 220, 190, .50), transparent 70%),
      #12141f;
  }

  h1 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 6px; }

  label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.92); }

  small { display: block; margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.6); }

  /* campos */
  input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    font: inherit;
    color: #fff;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 18px;
    outline: none;
    backdrop-filter: blur(14px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -1px 0 rgba(255,255,255,.06),
      0 4px 14px rgba(0,0,0,.25);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }
  input[type="text"]::placeholder { color: rgba(255,255,255,.5); }
  input[type="text"]:focus {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.5);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.45),
      0 0 0 3px rgba(130,170,255,.35),
      0 4px 14px rgba(0,0,0,.25);
  }

  /* sugestões das abas abertas */
  .sugg { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.6); }
  .chip {
    margin: 3px 4px 0 0;
    padding: 2px 10px;
    font: inherit;
    font-size: 12px;
    color: #fff;
    cursor: pointer;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
    transition: background .15s, transform .1s;
  }
  .chip:hover { background: rgba(255,255,255,.24); }
  .chip:active { transform: scale(.96); }

  /* toggle */
  .switch-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; font-size: 14px; cursor: pointer; }
  .switch-row input { position: absolute; opacity: 0; width: 0; height: 0; }
  .slider {
    position: relative;
    flex: none;
    width: 44px;
    height: 26px;
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.25);
    transition: background .25s;
  }
  .slider::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(180deg, #fff, #e6ecff);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    transition: transform .25s cubic-bezier(.3, 1.4, .5, 1);
  }
  .switch-row input:checked + .slider { background: rgba(52,230,160,.55); border-color: rgba(255,255,255,.4); }
  .switch-row input:checked + .slider::before { transform: translateX(18px); }
  .switch-row input:focus-visible + .slider { outline: 2px solid rgba(160,190,255,.9); outline-offset: 2px; }

  /* botão salvar */
  #save {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.12));
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 14px;
    backdrop-filter: blur(16px) saturate(180%);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.6),
      inset 0 -8px 16px rgba(255,255,255,.06),
      0 8px 24px rgba(0,0,0,.35);
    transition: transform .12s, background .2s;
  }
  #save:hover { background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.18)); }
  #save:active { transform: scale(.98); }

  #status { margin-top: 10px; min-height: 1.2em; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Player Mixer → Nimo</h1>
  <small>Em cada campo vale colar só o nome ou o link inteiro do canal.</small>

  <label class="switch-row">
    <input type="checkbox" id="enabled">
    <span class="slider"></span>
    <span>Ativar troca de player</span>
  </label>

  <label for="twitchChannel">Canal da Twitch</label>
  <input type="text" id="twitchChannel" placeholder="nome ou link do canal" autocomplete="off">
  <div class="sugg" id="sugg-twitchChannel"></div>

  <label for="kickChannel">Canal da Kick</label>
  <input type="text" id="kickChannel" placeholder="nome ou link do canal" autocomplete="off">
  <div class="sugg" id="sugg-kickChannel"></div>

  <label for="nimoChannel">Canal da Nimo</label>
  <input type="text" id="nimoChannel" placeholder="nome ou link do canal" autocomplete="off">
  <div class="sugg" id="sugg-nimoChannel"></div>
  <small>Deixe em branco o que não for usar.</small>

  <button id="save">Salvar e recarregar a aba</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
